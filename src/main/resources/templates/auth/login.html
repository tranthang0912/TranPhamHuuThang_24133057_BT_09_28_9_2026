<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<div class="auth-page">
    <section class="auth-card">
        <a class="auth-brand" th:href="@{/}"><span class="brand-mark">HT</span> HUUTHANG SHOP</a>
        <p class="eyebrow">SPRING SECURITY 7</p>
        <h1>Đăng nhập</h1>
        <p class="auth-description">Dùng username hoặc email để truy cập hệ thống.</p>

        <div th:if="${param.error}" class="alert error">Thông tin đăng nhập không đúng hoặc tài khoản chưa xác thực.</div>
        <div th:if="${param.logout}" class="alert success">Bạn đã đăng xuất thành công.</div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <label for="username">Username hoặc Email</label>
            <input id="username" name="username" autocomplete="username" required autofocus>

            <label for="password">Mật khẩu</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>

            <button class="button full" type="submit">Đăng nhập</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/register}">Tạo tài khoản</a>
            <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </div>
    </section>
</div>
</body>
</html>
