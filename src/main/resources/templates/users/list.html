<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quản lý Users')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <section class="page-heading inline-heading">
            <div>
                <p class="eyebrow">ADMINISTRATION</p>
                <h1>Quản lý Users</h1>
                <p>Tìm kiếm, phân trang, phân quyền và theo dõi số sản phẩm của từng User.</p>
            </div>
            <a class="button" th:href="@{/users/create}">+ Thêm User</a>
        </section>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <section class="card table-card">
            <div class="toolbar">
                <form th:action="@{/users}" method="get">
                    <input name="keyword" th:value="${keyword}" placeholder="Username, email, họ tên...">
                    <input type="hidden" name="size" th:value="${size}">
                    <button class="button" type="submit">Tìm kiếm</button>
                </form>
            </div>

            <table>
                <thead>
                <tr>
                    <th>ID</th><th>Username</th><th>Email</th><th>Họ tên</th>
                    <th>Role</th><th>Trạng thái</th><th>Products</th><th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}">
                    <td th:text="${user.id}"></td>
                    <td><strong th:text="${user.username}"></strong></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td><span class="role-badge light" th:text="${user.roleName}"></span></td>
                    <td><span class="status-badge" th:classappend="${user.enabled ? 'active' : 'inactive'}"
                              th:text="${user.enabled ? 'ACTIVE' : 'INACTIVE'}"></span></td>
                    <td th:text="${user.productCount}"></td>
                    <td class="actions">
                        <a class="table-link" th:href="@{/users/edit/{id}(id=${user.id})}">Sửa</a>
                        <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post"
                              onsubmit="return confirm('Xóa User này và toàn bộ Product liên quan?')">
                            <button class="danger-link" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users.empty}"><td colspan="8" class="empty-state">Không có dữ liệu.</td></tr>
                </tbody>
            </table>

            <nav class="pagination" th:if="${users.totalPages > 0}" aria-label="Phân trang Users">
                <a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">Trước</a>
                <a th:each="index : ${#numbers.sequence(0, users.totalPages - 1)}"
                   th:classappend="${index == users.number ? 'active' : ''}"
                   th:href="@{/users(page=${index},size=${size},keyword=${keyword})}"
                   th:text="${index + 1}"></a>
                <a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">Sau</a>
            </nav>
        </section>
    </main>
</div>
</body>
</html>
