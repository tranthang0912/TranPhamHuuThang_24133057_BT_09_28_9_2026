<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<div class="auth-page">
    <section class="auth-card compact-card">
        <span class="auth-symbol">?</span>
        <h1>Quên mật khẩu</h1>
        <p class="auth-description">Chúng tôi sẽ gửi OTP đặt lại mật khẩu tới email đã đăng ký.</p>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="item : ${#fields.globalErrors()}" th:text="${item}"></p>
            </div>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email" required>
            <small class="error-text" th:errors="*{email}"></small>
            <button class="button full" type="submit">Gửi OTP</button>
        </form>
        <div class="auth-links single"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
    </section>
</div>
</body>
</html>
