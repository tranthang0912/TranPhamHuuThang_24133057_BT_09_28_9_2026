<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">
        <span class="brand-mark">HT</span>
        <span>HUUTHANG SHOP</span>
    </a>

    <nav class="main-nav" aria-label="Điều hướng chính">
        <a th:href="@{/}">Dashboard</a>
        <a th:if="${#authorization.expression('isAuthenticated()')}" th:href="@{/products}">Products</a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/users}">Users</a>
    </nav>

    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
        <img class="avatar"
             th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/avatar-default.svg'}"
             alt="Ảnh đại diện">
        <span class="account-copy">
            <strong th:text="${#authentication.principal.fullName}">Người dùng</strong>
            <small th:text="${#authentication.name}">username</small>
        </span>
        <span class="role-badge" th:text="${#authentication.principal.role}">ROLE_USER</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="link-button">Đăng xuất</button>
        </form>
    </div>

    <div class="guest-actions" th:unless="${#authorization.expression('isAuthenticated()')}">
        <a class="button secondary" th:href="@{/register}">Đăng ký</a>
        <a class="button" th:href="@{/login}">Đăng nhập</a>
    </div>
</header>
</body>
</html>
