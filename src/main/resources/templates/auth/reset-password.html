<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<div class="auth-page">
    <section class="auth-card compact-card">
        <span class="auth-symbol">KEY</span>
        <h1>Đặt lại mật khẩu</h1>
        <p class="auth-description">OTP chỉ được sử dụng một lần và hết hạn sau 5 phút.</p>

        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="item : ${#fields.globalErrors()}" th:text="${item}"></p>
            </div>

            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" required>
            <small class="error-text" th:errors="*{email}"></small>

            <label for="otp">OTP</label>
            <input id="otp" class="otp-input" name="otp" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required>

            <label for="password">Mật khẩu mới</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required>
            <small class="error-text" th:errors="*{password}"></small>

            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
            <small class="error-text" th:errors="*{confirmPassword}"></small>

            <button class="button full" type="submit">Đổi mật khẩu</button>
        </form>
        <div class="auth-links single"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
    </section>
</div>
</body>
</html>
